{% extends "base.html" %}

{% block title %}Great Houses — The Great Books{% endblock %}

{% block content %}
<section id="page-houses" class="page">
    <div class="page-header">
        <div>
            <h1>Great Houses of Westeros</h1>
            <p class="subtitle">Noble Bloodlines & Seat Allegiances</p>
        </div>
        <div style="display: flex; align-items: center; gap: 0.75rem;">
            <button type="button" id="create-house-button" class="btn-primary hidden"
                onclick="openCreateHouseForm()">Create House</button>
            <span class="role-badge" id="houses-count">0 Houses</span>
        </div>
    </div>
    <div id="create-house-wrapper" class="auth-wrapper hidden" style="margin: 1.5rem auto;">
        <form id="create-house-form" class="auth-form" onsubmit="handleCreateHouse(event)">
            <h2>Create a Great House</h2>
            <label>House Name
                <input type="text" id="create-house-name" maxlength="20" required>
            </label>
            <label>House Motto
                <input type="text" id="create-house-motto" maxlength="30" required>
            </label>
            <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
                <button type="submit" class="btn-primary" style="flex: 1; margin-top: 0;">Create House</button>
                <button type="button" class="btn-secondary" onclick="closeCreateHouseForm()">Cancel</button>
            </div>
        </form>
    </div>
    <div id="houses-grid" class="houses-grid"></div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='houses.js') }}"></script>
{% endblock %}
