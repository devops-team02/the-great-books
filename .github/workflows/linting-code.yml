name: Linting Python, Ansible, Packer & Vagrant

run-name: '${{ github.event_name }}: ${{ github.head_ref }} by ${{ github.actor }}'

on: 
  # push:
  #   branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  python-version: 3.14
  ruff-version: 0.17.6
  path_to_linter_cfgs: ${{github.workspace}}/.github/workflows/linting_configs

jobs:
  linting:
    name: Source Code linting
    runs-on: ubuntu-26.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Python ${{ env.python-version }}
        uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ env.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==${{ env.ruff-version }}

      - name: Lint Python code
        run: |
          ruff check --config ${{env.path_to_linter_cfgs}}/ruff.toml
        working-directory: web




