name: Linting Python, Ansible, Packer and Shell scripts

run-name: ${{ github.workflow.name }} - ${{ github.actor }}

on: 
  pull_request:
    branches: ["main"]

env:
  python-version: 3.10.12
  ruff-version: 0.17.6

jobs:
  linting:
    name: Source Code linting
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Python ${{ env.python-version }}
        uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ env.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff-${{ env.ruff-version }}
        # pip install flake8 pylint black isort yamllint ansible-lint packer-linter shellcheck

      - name: Lint Python code
        run: |
          ruff check
        working-directory: web


